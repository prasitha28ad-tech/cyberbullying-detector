<!DOCTYPE html>
<html>
<head>
    <title>Cyberbullying Detector</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .main-card {
            max-width: 600px;
            margin: 80px auto;
            padding: 30px;
            border-radius: 20px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }

        textarea {
            background: #1e293b !important;
            color: white !important;
            border: none !important;
            border-radius: 12px;
            padding: 12px;
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        .btn-custom {
            border-radius: 10px;
        }

        .result {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }

        .safe { color: #22c55e; }
        .danger { color: #ef4444; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="main-card">

    <!-- TOP BAR -->
    <div class="top-bar">
        <h4>🚨 Cyberbullying AI</h4>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>

    <!-- FORM -->
    <form method="POST" enctype="multipart/form-data">

        <textarea name="comment" class="form-control mb-3" placeholder="Type your message..." required></textarea>

        <input type="file" name="evidence" class="form-control mb-3">

        <button type="submit" class="btn btn-primary w-100 btn-custom">
            🔍 Analyze
        </button>

    </form>

    <!-- RESULT -->
    {% if result %}
        {% if result == "bullying" %}
            <p class="result danger">
                🚫 Cyberbullying Detected <br>
                🔥 Score: {{ score }}
            </p>
        {% else %}
            <p class="result safe">
                ✅ Safe Message <br>
                😊 Score: {{ score }}
            </p>
        {% endif %}
    {% endif %}

    <!-- ACTION BUTTONS -->
    <a href="/history" class="btn btn-secondary mt-3 w-100">📊 View History</a>

</div>

</body>
</html>
