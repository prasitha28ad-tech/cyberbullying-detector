<!DOCTYPE html>

<html>
<head>
    <title>SafeChat AI</title>

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        font-family: 'Segoe UI', sans-serif;
    }

    .container-box {
        max-width: 600px;
        margin: auto;
        margin-top: 50px;
        background: #1e293b;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0px 0px 25px rgba(0,0,0,0.6);
    }

    .chat-box {
        height: 400px;
        overflow-y: auto;
        background: #0f172a;
        padding: 15px;
        border-radius: 15px;
        margin-bottom: 15px;
    }

    .message {
        padding: 10px 15px;
        margin: 10px 0;
        border-radius: 15px;
        max-width: 75%;
        font-size: 14px;
    }

    .user {
        background: #2563eb;
        margin-left: auto;
        text-align: right;
    }

    .safe {
        background: #16a34a;
    }

    .toxic {
        background: #dc2626;
    }

    .input-box {
        display: flex;
        gap: 10px;
    }

    input {
        border-radius: 10px !important;
    }

    .btn-send {
        border-radius: 10px;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .title {
        font-size: 22px;
        font-weight: bold;
    }

    .subtitle {
        font-size: 12px;
        color: #94a3b8;
    }

    .footer {
        text-align: center;
        font-size: 12px;
        margin-top: 10px;
        color: #64748b;
    }
</style>
```

</head>

<body>

<div class="container-box">

```
<!-- HEADER -->
<div class="header">
    <div>
        <div class="title">🛡 SafeChat AI</div>
        <div class="subtitle">Real-time Cyberbullying Detection System</div>
    </div>
    <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
</div>

<!-- CHAT AREA -->
<div class="chat-box">

    {% for row in data %}

        <!-- USER MESSAGE -->
        <div class="message user">
            {{ row[0] }}
        </div>

        <!-- AI RESPONSE -->
        {% if row[1] == 'bullying' %}
            <div class="message toxic">
                ⚠ Toxic Detected <br>
                Score: {{ row[2] }}

                <br>
                <button class="btn btn-warning btn-sm mt-1">Report</button>
            </div>
        {% else %}
            <div class="message safe">
                ✅ Safe Message <br>
                Score: {{ row[2] }}
            </div>
        {% endif %}

    {% endfor %}

</div>

<!-- INPUT -->
<form method="POST">
    <div class="input-box">
        <input type="text" name="comment" class="form-control" placeholder="Type your message..." required>
        <button type="submit" class="btn btn-primary btn-send">Send</button>
    </div>
</form>

<!-- FOOTER -->
<div class="footer">
    🚀 Powered by AI | Cyber Safety Project
</div>
```

</div>

</body>
</html>
