</head>

<body>

<div class="container-box">

```
<!-- HEADER -->
<div class="header">
    <div>
        <div class="title">🛡 SafeChat AI</div>
        <div class="subtitle">Real-time Cyberbullying Detection System</div>
    </div>
    <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
</div>

<!-- CHAT AREA -->
<div class="chat-box" id="chatBox"></div>

<!-- INPUT -->
<div class="input-box">
    <input type="text" id="messageInput" class="form-control" placeholder="Type your message..." required>
    <button type="button" class="btn btn-primary btn-send" onclick="sendMessage()">Send</button>
</div>

<!-- FOOTER -->
<div class="footer">
    🚀 Powered by AI | Cyber Safety Project
</div>
```

</div>

<script>
function sendMessage() {
    let input = document.getElementById("messageInput");
    let text = input.value.trim();

    if (!text) return;

    let chatBox = document.getElementById("chatBox");

    // Show user message
    chatBox.innerHTML += `<div class="message user">${text}</div>`;

    // Scroll down
    chatBox.scrollTop = chatBox.scrollHeight;

    // Send to backend
    fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ text: text })
    })
    .then(res => res.json())
    .then(data => {

        if (data.result === "bullying") {
            chatBox.innerHTML += `
                <div class="message toxic">
                    ⚠ Toxic Detected <br>
                    Score: ${data.score} <br>
                    <button class="btn btn-warning btn-sm mt-1">Report</button>
                </div>`;
        } else {
            chatBox.innerHTML += `
                <div class="message safe">
                    ✅ Safe Message <br>
                    Score: ${data.score}
                </div>`;
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    });

    input.value = "";
}

// ENTER KEY SUPPORT 🔥
document.getElementById("messageInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
