<!DOCTYPE html>
<html>
<head>
    <title>Cyberbullying Detection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .card-custom {
            background: #1e293b;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }

        textarea {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            border: none;
            padding: 10px;
            background: #334155;
            color: white;
        }

        textarea::placeholder {
            color: #cbd5f5;
        }

        .btn-custom {
            border-radius: 10px;
        }

        .safe {
            color: #22c55e;
        }

        .danger {
            color: #ef4444;
        }
    </style>
</head>

<body>

<!-- 🔝 NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">🤖 Cyberbullying Detector</span>

    <div>
        <span class="me-3">Welcome, Admin</span>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container mt-5 d-flex justify-content-center">
    <div class="card-custom col-md-6">

        <h3 class="text-center mb-4">Analyze Comment</h3>

        <form method="POST" enctype="multipart/form-data">

            <textarea name="comment" placeholder="Type your comment here..." required></textarea>

            <input type="file" name="evidence" class="form-control mt-3">

            <button type="submit" class="btn btn-primary w-100 mt-3 btn-custom">
                🚀 Analyze
            </button>
        </form>

        <!-- RESULT -->
        {% if result %}
            {% if result == "bullying" %}
                <p class="danger text-center mt-3">
                    🚫 Cyberbullying Detected <br>
                    Score: {{ score }}
                </p>
            {% else %}
                <p class="safe text-center mt-3">
                    ✅ Safe Comment <br>
                    Score: {{ score }}
                </p>
            {% endif %}
        {% endif %}

        <!-- ACTION BUTTONS -->
        <div class="mt-4">
            <a href="/history" class="btn btn-secondary w-100 mb-2">📄 History</a>
            <a href="/dashboard" class="btn btn-info w-100 mb-2">📊 Dashboard</a>
        </div>

        <a href="https://cybercrime.gov.in" target="_blank">
            <button class="btn btn-danger w-100 mt-2">🚨 Report</button>
        </a>

    </div>
</div>

</body>
</html>
